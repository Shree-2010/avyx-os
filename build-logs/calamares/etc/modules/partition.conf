---
# Single-disk default: erase the disk and install (the summary page shows exactly what will
# happen and asks for confirmation before anything is written). zram is used instead of swap.
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 300MiB
efiSystemPartitionName: EFI
userSwapChoices:
    - none
    - file
initialPartitioningChoice: erase
initialSwapChoice: none
defaultFileSystemType: "ext4"
availableFileSystemTypes: ["ext4", "btrfs"]
