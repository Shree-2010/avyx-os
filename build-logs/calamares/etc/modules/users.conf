---
# Based on the Debian defaults, with one change: the password dictionary check is turned off.
# The image ships no cracklib dictionary, so the check could only ever fail with
# "error loading dictionary" and block the Next button for every password.
userGroup:       users
defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth
autologinGroup:  autologin
sudoersGroup:    sudo
setRootPassword: false
passwordRequirements:
    nonempty: true
    minLength: -1
    maxLength: -1
    libpwquality:
        - minlen=0
        - minclass=0
        - dictcheck=0
        - usercheck=0
