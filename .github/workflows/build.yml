name: build-iso

on:
  push:
    branches: [main, m1-scaffold]
    paths-ignore:
      - "tools/install_test.py"
      - ".github/workflows/install-test.yml"
    tags: ["m*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      AVYX_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('0.1.0-dev+{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup || true
          sudo docker image prune --all --force >/dev/null || true
          df -h /

      - name: Build ISO (Debian trixie container)
        run: |
          mkdir -p out build-logs
          docker run --rm --privileged \
            -e AVYX_VERSION="$AVYX_VERSION" -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -v "$PWD":/work -w /work debian:trixie bash /work/tools/ci-build.sh

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf imagemagick
          ls -l /dev/kvm || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || echo "no /dev/kvm: tests will run under slow software emulation"

      - name: Boot test (UEFI)
        id: uefi
        continue-on-error: true
        run: python3 tools/qemu_shots.py --iso out/AVYX-OS-*.iso --out out/test --mode uefi --timeout 600

      - name: Boot test (legacy BIOS)
        id: bios
        continue-on-error: true
        run: python3 tools/qemu_shots.py --iso out/AVYX-OS-*.iso --out out/test --mode bios --timeout 600

      - name: Install test (Calamares to a blank disk, then boot the installed disk)
        id: install
        continue-on-error: true
        run: python3 tools/install_test.py --iso out/AVYX-OS-*.iso --out out/install

      - name: Release notes from measured results
        if: always()
        run: |
          cp -f out/test/result-*.json out/ 2>/dev/null || true
          cp -f out/install/result-install.json out/ 2>/dev/null || true
          python3 tools/make_notes.py out "$AVYX_VERSION" > out/RELEASE_NOTES.md || true
          cat out/RELEASE_NOTES.md || true

      - name: Publish test evidence to the ci-results branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          ev="$(mktemp -d)"
          cp -r out/test "$ev/test" 2>/dev/null
          cp -r out/install "$ev/install" 2>/dev/null
          rm -f "$ev"/install/*.qcow2
          cp out/RELEASE_NOTES.md out/dropped-packages.txt out/packages.txt out/*.sha256 "$ev/" 2>/dev/null
          cp -r build-logs "$ev/build-logs" 2>/dev/null
          tail -n 800 build-logs/lb-build.log > "$ev/lb-build-tail.log" 2>/dev/null
          rm -f "$ev/build-logs/lb-build.log"
          find "$ev" \( -name '*.fd' -o -name '*.sock' \) -delete
          echo "run ${{ github.run_number }} commit ${{ github.sha }} at $(date -u +%FT%TZ)" > "$ev/RUN.txt"
          cd "$ev" && git init -q -b ci-results \
            && git config user.name "avyx-ci" && git config user.email "ci@avyx.invalid" \
            && git add -A && git commit -q -m "CI evidence for run ${{ github.run_number }}" \
            && git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-results
          exit 0

      - name: Upload test evidence (screenshots, serial logs, notes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: |
            out/test/
            out/install/*.png
            out/install/*.json
            out/install/*.log
            out/RELEASE_NOTES.md
            out/dropped-packages.txt
            out/packages.txt
            out/*.sha256
            out/lb-build.log.gz
            build-logs/
          retention-days: 14

      - name: Keep the latest built ISO as a pre-release (used by the quick install-test workflow)
        if: always() && github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          cd out && iso="$(ls AVYX-OS-*.iso 2>/dev/null | head -1)"
          [ -n "$iso" ] || exit 0
          gh release delete ci-latest --cleanup-tag -y --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          gh release create ci-latest "$iso" "$iso.sha256" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Latest CI build (testing only, may be broken)" --prerelease \
            --notes "Automatic build of commit $GITHUB_SHA. Not a release: it may not boot or install. See the tagged releases." 
          exit 0

      - name: Publish GitHub Release (tags only)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd out
          iso="$(ls AVYX-OS-*.iso)"
          size=$(stat -c %s "$iso")
          files=("$iso.sha256" packages.txt)
          if [ "$size" -gt 2000000000 ]; then
            split -b 1900M -d -a 2 "$iso" "$iso.part"
            rm "$iso"
            files+=("$iso".part*)
            printf '\n**The ISO is split because GitHub limits release files to 2 GiB.** Join with: `cat %s.part* > %s` and verify with the SHA256.\n' "$iso" "$iso" >> RELEASE_NOTES.md
          else
            files+=("$iso")
          fi
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" --title "AVYX OS $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md --prerelease
