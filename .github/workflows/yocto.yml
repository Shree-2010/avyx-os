name: yocto-build

on:
  push:
    branches: [yocto]
    paths:
      - "meta-avyx/**"
      - "yocto/**"
      - "tools/qemu_boot.py"
      - ".github/workflows/yocto.yml"
  workflow_dispatch:
    inputs:
      attempt:
        description: "Resume counter (the workflow re-dispatches itself while the build is unfinished)"
        default: "1"
      budget_minutes:
        description: "Minutes bitbake may run before it is stopped and its progress cached"
        default: "285"
      skip_tests:
        description: "Skip the QEMU boot tests"
        default: "false"

permissions:
  contents: write
  actions: write

concurrency:
  group: yocto-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      ATTEMPT: ${{ inputs.attempt || '1' }}
      BUDGET: ${{ inputs.budget_minutes || '285' }}
      AVYX_VERSION: 0.1.0-dev+${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup /usr/share/swift || true
          sudo docker image prune --all --force >/dev/null || true
          df -h /

      - name: Host packages for Yocto + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gawk wget git diffstat unzip texinfo gcc g++ build-essential chrpath socat cpio python3 python3-pip \
            python3-pexpect xz-utils debianutils iputils-ping python3-git python3-jinja2 python3-subunit zstd \
            lz4 liblz4-tool file locales libacl1 rsync bc libssl-dev \
            qemu-system-x86 qemu-utils ovmf imagemagick
          sudo locale-gen en_US.UTF-8
          # Ubuntu 24.04 blocks unprivileged user namespaces, which bitbake's network isolation uses
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          ls -l /dev/kvm || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true

      - name: Restore download cache
        uses: actions/cache/restore@v4
        with:
          path: yocto/cache/downloads
          key: yocto-dl-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: yocto-dl-

      - name: Restore sstate cache
        uses: actions/cache/restore@v4
        with:
          path: yocto/cache/sstate
          key: yocto-sstate-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: yocto-sstate-

      - name: Fetch layers and configure
        run: |
          mkdir -p yocto/cache/downloads yocto/cache/sstate
          yocto/setup.sh
          du -sh yocto/cache/* yocto/sources/* || true

      - name: Build avyx-image (time boxed, progress is cached)
        id: bb
        continue-on-error: true
        run: |
          export LC_ALL=en_US.UTF-8 LANG=en_US.UTF-8
          set +e
          source yocto/sources/poky/oe-init-build-env yocto/build >/dev/null
          timeout -s INT -k 300 $(( BUDGET * 60 )) bitbake avyx-image 2>&1 | tee "$GITHUB_WORKSPACE/bitbake.log"
          rc=${PIPESTATUS[0]}
          echo "bitbake exit code: $rc"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Did the build finish?
        id: fin
        run: |
          iso="$(ls -L yocto/build/tmp/deploy/images/avyx-x86-64/*.iso 2>/dev/null | head -1)"
          if [ -n "$iso" ] && [ "${{ steps.bb.outputs.rc }}" = "0" ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            mkdir -p out
            cp -L "$iso" "out/AVYX-OS-${AVYX_VERSION}-x86_64.iso"
            (cd out && sha256sum AVYX-OS-*.iso > "AVYX-OS-${AVYX_VERSION}-x86_64.iso.sha256")
            ls -la out
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi
          grep -E "^ERROR" bitbake.log | head -40 || true
          grep -E "Setscene tasks|Currently [0-9]+ running tasks|NOTE: Tasks Summary" bitbake.log | tail -5 || true
          df -h /

      - name: Slim caches before saving
        if: always()
        run: |
          rm -rf yocto/cache/downloads/git2 || true   # shallow tarballs are kept; the clones are huge
          find yocto/cache/downloads -name '*.lock' -delete 2>/dev/null || true
          du -sh yocto/cache/downloads yocto/cache/sstate || true

      - name: Save download cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: yocto/cache/downloads
          key: yocto-dl-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save sstate cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: yocto/cache/sstate
          key: yocto-sstate-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Continue in a new run when the build was only time-boxed
        if: steps.fin.outputs.done != 'true' && steps.bb.outputs.rc == '124' && fromJSON(env.ATTEMPT) < 8
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run yocto.yml --repo "$GITHUB_REPOSITORY" --ref "${GITHUB_REF_NAME}" \
            -f attempt=$(( ATTEMPT + 1 )) -f budget_minutes="$BUDGET"

      - name: Boot test (UEFI)
        id: uefi
        if: steps.fin.outputs.done == 'true' && inputs.skip_tests != 'true'
        continue-on-error: true
        run: python3 tools/qemu_boot.py --iso out/AVYX-OS-*.iso --out out/test --mode uefi --timeout 600

      - name: Boot test (legacy BIOS)
        id: bios
        if: steps.fin.outputs.done == 'true' && inputs.skip_tests != 'true'
        continue-on-error: true
        run: python3 tools/qemu_boot.py --iso out/AVYX-OS-*.iso --out out/test --mode bios --timeout 600

      - name: Publish evidence to the ci-yocto branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          ev="$(mktemp -d)"
          cp -r out/test "$ev/test" 2>/dev/null
          tail -n 600 bitbake.log > "$ev/bitbake-tail.log" 2>/dev/null
          grep -E "^(ERROR|WARNING)" bitbake.log | sort | uniq -c | sort -rn | head -80 > "$ev/bitbake-problems.txt" 2>/dev/null
          ls -la out > "$ev/out-listing.txt" 2>/dev/null
          cp out/*.sha256 "$ev/" 2>/dev/null
          find yocto/build/tmp/deploy/images -maxdepth 2 -name '*.manifest' -exec cp {} "$ev/" \; 2>/dev/null
          find yocto/build/tmp/work -name 'run.do_*.*' -newer bitbake.log 2>/dev/null | head -0
          # logs of failed tasks
          mkdir -p "$ev/failed-logs"
          for f in $(grep -oE "/[^ ]+/temp/log\.do_[a-z_]+\.[0-9]+" bitbake.log | sort -u | head -12); do cp "$f" "$ev/failed-logs/" 2>/dev/null; done
          find "$ev" \( -name '*.fd' -o -name '*.sock' \) -delete
          echo "run ${{ github.run_number }} attempt $ATTEMPT commit ${{ github.sha }} at $(date -u +%FT%TZ) rc=${{ steps.bb.outputs.rc }} done=${{ steps.fin.outputs.done }}" > "$ev/RUN.txt"
          cd "$ev" && git init -q -b ci-yocto \
            && git config user.name "avyx-ci" && git config user.email "ci@avyx.invalid" \
            && git add -A && git commit -q -m "CI evidence for run ${{ github.run_number }} (attempt $ATTEMPT)" \
            && git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-yocto
          exit 0

      - name: Upload the ISO
        if: steps.fin.outputs.done == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: avyx-iso
          path: |
            out/AVYX-OS-*.iso
            out/AVYX-OS-*.sha256
          retention-days: 7
          compression-level: 0
