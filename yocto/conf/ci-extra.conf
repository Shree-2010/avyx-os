# CI-oriented settings (also fine for local builds)
INHERIT += "rm_work"
RM_WORK_EXCLUDE += "avyx-image avyx-initramfs linux-yocto"
BB_DISKMON_DIRS = "STOPTASKS,${TMPDIR},1G,100K STOPTASKS,${DL_DIR},1G,100K STOPTASKS,${SSTATE_DIR},1G,100K"
BB_GIT_SHALLOW = "1"
BB_GENERATE_SHALLOW_TARBALLS = "1"
BB_GIT_SHALLOW_DEPTH = "1"
BB_NUMBER_PARSE_THREADS ?= "4"
# fewer parallel heavy jobs than cores to stay inside the 16 GB runner RAM
BB_PRESSURE_MAX_MEMORY ?= "20000"
