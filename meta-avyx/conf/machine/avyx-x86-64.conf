#@TYPE: Machine
#@NAME: AVYX generic x86-64 PC (BIOS + UEFI, also runs in QEMU/KVM)
#@DESCRIPTION: One machine for real laptops/desktops and for the CI virtual machine.

# Baseline x86-64 (SSE2): runs on every 64-bit Intel/AMD CPU, including old Core i3.
DEFAULTTUNE = "x86-64"
require conf/machine/include/x86/arch-x86.inc
require conf/machine/include/x86/x86-base.inc

MACHINE_FEATURES += "pcbios efi wifi bluetooth keyboard screen alsa x86 acpi qemu-usermode"

PREFERRED_PROVIDER_virtual/kernel = "linux-yocto"
PREFERRED_VERSION_linux-yocto = "6.6%"
KERNEL_IMAGETYPE = "bzImage"
SERIAL_CONSOLES = "115200;ttyS0"

EFI_PROVIDER = "grub-efi"
IMAGE_FSTYPES = "iso"

MACHINE_EXTRA_RRECOMMENDS += "kernel-modules linux-firmware"
