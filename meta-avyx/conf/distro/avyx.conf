# AVYX OS distribution: Poky-derived (keeps toolchain/sstate compatible), systemd,
# Wayland only (no X11 server), PAM + polkit for a normal desktop login model.
require conf/distro/poky.conf

DISTRO = "avyx"
DISTRO_NAME = "AVYX OS"
DISTRO_VERSION = "0.1.0"
DISTRO_CODENAME = "aurora"
SDK_VENDOR = "-avyxsdk"
MAINTAINER = "AVYX OS <noreply@avyx.invalid>"
TARGET_VENDOR = "-avyx"

# systemd as init, NetworkManager etc. need it
INIT_MANAGER = "systemd"

DISTRO_FEATURES = " \
    acl alsa bluetooth ext2 ipv4 ipv6 usbhost wifi xattr pci vfat seccomp \
    opengl wayland pam polkit systemd usrmerge pipewire gobject-introspection-data \
    ${DISTRO_FEATURES_LIBC} \
"
DISTRO_FEATURES_BACKFILL_CONSIDERED:append = " sysvinit"
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"

# Slim down what poky adds for development
KERNEL_EXTRA_FEATURES:remove = "features/debug/debug-kernel.scc"
INHERIT:remove = "create-spdx"

# Package manager metadata is not shipped in the image (read-only squashfs live system)
IMAGE_FEATURES:remove = "package-management"

# Licensing: ship the license texts and a manifest inside the image
COPY_LIC_MANIFEST = "1"
COPY_LIC_DIRS = "1"
LICENSE_FLAGS_ACCEPTED = "commercial"

# Locale: keep it small
IMAGE_LINGUAS = "en-us en-gb"
GLIBC_GENERATE_LOCALES = "en_US.UTF-8 en_GB.UTF-8"

PREFERRED_PROVIDER_virtual/libgl = "mesa"
PREFERRED_PROVIDER_virtual/egl = "mesa"
PREFERRED_PROVIDER_virtual/libgles2 = "mesa"
PREFERRED_PROVIDER_virtual/libgbm = "mesa"
PREFERRED_PROVIDER_jpeg = "libjpeg-turbo"
PREFERRED_PROVIDER_udev = "systemd"
PREFERRED_PROVIDER_libudev = "systemd"
PREFERRED_PROVIDER_virtual/libudev = "systemd"

# Boot splash is Plymouth (AVYX theme), not psplash
SPLASH = "plymouth"

# Things pulled in by "recommends" that we do not want (GTK3 tools, menu generators)
BAD_RECOMMENDATIONS += "labwc-tweaks labwc-menu-generator"
