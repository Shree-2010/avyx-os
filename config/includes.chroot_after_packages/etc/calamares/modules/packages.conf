---
# Remove the live-session packages from the installed system. Debian's default list names
# packages that this image does not contain (live-task-*), and apt aborts the whole removal
# when one name is unknown, which made the install fail. `try_remove` removes each package
# separately and carries on when one is missing.
backend: apt
operations:
  - try_remove:
      - live-boot
      - live-config
      - live-config-systemd
      - live-tools
      - calamares-settings-debian
